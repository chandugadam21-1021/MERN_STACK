<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        html, body{
            margin:0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, Helvetica, sans-serif;
        }
        fieldset{
            border-radius: 10px;
            width: fit-content;
            margin-top:25% ;
        }
        h2{
            padding-bottom: 30px;
        }
        input{
            width:97.5%;
            height: 20px;

        }
        .gender{
            width: 10%;
        }
        button{
            width: 100px;
            height: 40px;
            font-weight: bold;
            font-size: large;
            border-radius: 10px ;
            background-color: blue;
            border: none;
            margin-left: 33.3%;
            color: white;
        }
    </style>
</head>
<body>
    <form action="">
        <fieldset>
            <h2 align="center">Registeration Form</h2>

            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" placeholder="Full name"><br><br>
            
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="email"><br><br>
            
            <label for="pswd">Password</label>
            <input type="password" id="pswd"><br><br>
            
            <label for="confirmPswd">Confirm Password</label>
            <input type="password" id="confirmPswd"><br><br>

            <label for="">Gender</label>
            <input type="radio" class="gender" id="male" name="gender" value="Male">
            <label for="male">Male</label>

            <input type="radio" class="gender" id="female" name="gender" value="Female">
            <label for="female">Female</label><br><br>

            <label for="dob">Date of Birth</label>
            <input type="date" id="dob"><br><br>

            <button type="submit">Submit</button>
        </fieldset>
    </form>
</body>
</html>
