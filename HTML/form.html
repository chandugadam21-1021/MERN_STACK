<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        
h1{
    color: blue;
    text-align: center;
}
body{
    margin: 70px 0px 0px 0px;
    font-family: Arial, Helvetica, sans-serif;
}
div{
    display: flex;
    justify-content: center;
    

}
fieldset{
    background-color: lightgray;
    border-radius: 10px;
    width: fit-content;
    padding: 50px;
    display: flex;
    flex-direction: column;
    justify-content: center;
}
label{
    font-weight: bold;
    margin-bottom:10px ;
}
input{
    border-radius: 5px;
    width: 250px;
    height: 30px;
    border: none;
}
button{
    background-color: rgb(89, 89, 252);
    color: white;
    border-radius: 5px;
    width: 100%;
    height: 40px;
    border: none;
    cursor: pointer;
}
button:hover{
    background-color:rgb(77, 77, 216);
}
a{
    text-decoration:none;
    font-weight: bold;
}
    </style>
</head>
<body>
    <h1>login</h1>
    <div>
        <fieldset>
            <label for="">Email</label>
            <input type="email"><br><br>
            <label for="">password</label>
            <input type="password"><br><br>
            
            <button type="submit">Login</button>
            <p align="center">Don't hava an account? <a href="#">create account</a></p>
        </fieldset>
    </div>
</body>
</html>
